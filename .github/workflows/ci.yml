name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PRs and main get a read-only quality gate. Publishing lives in pages.yml.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          if-no-files-found: error
          retention-days: 7
