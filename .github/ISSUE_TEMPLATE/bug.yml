name: Bug
description: Something is broken on the site or in the build.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Security reports go to [SECURITY.md](https://github.com/jasodeep/leetflix/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What did you see? What did you expect?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://jasodeep.github.io/leetflix/problems/two-sum/
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open … 2. Click …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / OS
      placeholder: Safari 18, macOS
